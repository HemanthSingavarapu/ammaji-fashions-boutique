databases:
  - name: blouse-postgres
    databaseName: blouse_db
    user: blouse_user
    plan: free

services:
  - type: web
    name: blouse-backend
    runtime: docker
    dockerfilePath: project_backend/Dockerfile
    dockerContext: project_backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: blouse-postgres
          property: connectionString

  - type: web
    name: blouse-customer
    runtime: static
    rootDir: customer-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://ammaji-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: blouse-admin
    runtime: static
    rootDir: admin-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://ammaji-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
