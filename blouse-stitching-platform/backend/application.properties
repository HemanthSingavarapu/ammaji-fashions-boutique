spring.application.name=blouse
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:mem:blouseDB;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT settings
jwt.secret=94a08da1fecbb6e8b46990538c7b50b2b8c9d0d3c051268b355883713f01b18361b7829704e6c1df7c6b5419811f5e8f4989679f2913e61897c8cf9fc13c3b52
jwt.expiration=86400000

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
