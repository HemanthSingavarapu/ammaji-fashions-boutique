spring.application.name=blouse

# Database Configuration (Production-Ready via ENV vars, defaults to H2 for local dev)
spring.datasource.url=${DB_URL:jdbc:h2:mem:blouseDB;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA Settings
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}

# JWT settings (Production-Ready via ENV vars)
jwt.secret=${JWT_SECRET:94a08da1fecbb6e8b46990538c7b50b2b8c9d0d3c051268b355883713f01b18361b7829704e6c1df7c6b5419811f5e8f4989679f2913e61897c8cf9fc13c3b52}
jwt.expiration=${JWT_EXPIRATION:86400000}

# H2 Console (Disabled in Production)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Email Configuration (Spring Mail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
