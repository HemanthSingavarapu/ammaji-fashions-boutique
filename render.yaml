services:
  - type: web
    name: blouse-backend
    runtime: docker
    dockerfilePath: blouse-stitching-platform/backend/Dockerfile
    dockerContext: blouse-stitching-platform/backend
    plan: free
    envVars:
      - key: PORT
        value: 8080

  - type: web
    name: blouse-customer
    runtime: static
    rootDir: blouse-stitching-platform/customer-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: blouse-admin
    runtime: static
    rootDir: blouse-stitching-platform/admin-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
